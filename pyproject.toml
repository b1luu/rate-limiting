[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimiter"
version = "0.1.0"
description = "Rate limiting algorithms built from scratch: fixed window, sliding window, token bucket."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ratelimiter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
